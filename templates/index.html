<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breached Credential Checker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 2rem; }
    .card { max-width: 520px; margin: 0 auto; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    form { display: grid; gap: 0.8rem; }
    input, button { padding: 0.7rem; font-size: 1rem; }
    button { border: none; background: #2f5cff; color: white; border-radius: 8px; cursor: pointer; }
    .status { margin-top: 1rem; padding: 0.8rem; border-radius: 8px; }
    .ok { background: #e9f9ee; color: #116329; }
    .bad { background: #fdecec; color: #8c1d1d; }
    .neutral { background: #eef1f5; color: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Breached Password Checker</h1>
    <p>Check whether an email/password pair appears in known breach data (using hashes only).</p>

    <form method="post" action="/check">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Check</button>
    </form>

    {% if status %}
      <div class="status {% if compromised is none %}neutral{% elif compromised %}bad{% else %}ok{% endif %}">
        {{ status }}
      </div>
    {% endif %}
  </div>
</body>
</html>
